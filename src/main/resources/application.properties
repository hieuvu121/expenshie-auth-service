spring.application.name=auth-service
server.servlet.context-path=/app/v1

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Database
# Statement caching was measured on expense-service at 47 prepares for ~90k
# executions. useLocalSessionState avoids the driver round-tripping to read
# server session state.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:auth_db}?useLocalSessionState=true&cachePrepStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection pool. The Hikari default of 10 saturated expense-service under
# load — 188 threads queued, acquire waits up to 1.9s. MySQL allows 151
# connections and peak use across all services was 42, so there is headroom.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# NOT setting hikari.auto-commit=false here, deliberately — it is a net loss in
# this service. That setting pays off when a request is wrapped in one
# transaction: it removes a SET autocommit round trip at each end. But this
# service has no service-level @Transactional, so each repository call runs in
# its own implicit transaction, and with autocommit off every one of them needs
# an explicit rollback to close. Measured on login: Com_rollback went from 0 to
# 4.00 per request and total round trips from 4.2 to 8.2. Reverted.
#
# The way to get the win here is a @Transactional(readOnly = true) around the
# login read path, so four implicit transactions become one. Left alone for now
# — that is a behaviour change to the auth flow, not config parity.

# Defaults to true in Spring Boot, which holds the persistence context and its
# connection open for the whole request including JSON serialization.
spring.jpa.open-in-view=false
# Safe to disable open-in-view: the only association here is
# ForgotPasswordEntity.userEntity, which is @OneToOne (EAGER by default) and is
# never traversed outside a repository call.

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Redis (JWT blacklist)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT (same secret shared with gateway for token signing/validation)
jwt.secret=${JWT_SECRET}

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Security — permit all inbound (JWT validated by gateway)
spring.security.user.name=none

# --- Actuator / Prometheus metrics ---
# The management server listens on its own port, which docker-compose never
# publishes, so /actuator is reachable only from inside the compose network.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
# Server-side histogram buckets, so Grafana can compute true p95/p99 rather
# than averaging pre-computed percentiles across instances.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
